services:
    db:
      image: postgres:16
      container_name: ecommerce-db
      environment:
        POSTGRES_DB: ecommerce
        POSTGRES_USER: ecommerce
        POSTGRES_PASSWORD: ecommerce
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U ecommerce" ] # Commande de test fournie avec Postgres
        interval: 5s
        retries: 5
volumes:
  pgdata:
